<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Garbigo Pickup Confirmed</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef1f0;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);max-width:560px;width:100%;">

                <tr>
                    <td th:insert="~{email/fragments/layout :: header}"></td>
                </tr>

                <tr>
                    <td style="padding:32px;">
                        <h1 style="font-size:20px;color:#1b4332;margin:0 0 8px;">Pickup confirmed</h1>
                        <p style="font-size:14px;color:#3c4a44;line-height:1.5;margin:0 0 20px;">
                            Hi <span th:text="${recipientName}">there</span>, we've got your request. Here's a
                            summary of what you scheduled:
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="border:1px solid #e2e6e4;border-radius:6px;margin:0 0 24px;">
                            <tr>
                                <td style="padding:12px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;">Request ID</td>
                                <td style="padding:12px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${requestId}">REQ-123
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;">Waste type</td>
                                <td style="padding:12px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${wasteType}">GENERAL
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;">Scheduled for</td>
                                <td style="padding:12px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${scheduledAt}">1 Jan 2026, 09:00
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;font-size:13px;color:#6b7a75;">Pickup location</td>
                                <td style="padding:12px 16px;font-size:13px;color:#1b4332;font-weight:600;text-align:right;"
                                    th:text="${locationSummary}">Westlands, Nairobi
                                </td>
                            </tr>
                        </table>

                        <p style="text-align:center;margin:0;">
                            <a th:href="${appUrl}"
                               style="display:inline-block;background-color:#2d6a4f;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 28px;border-radius:6px;">
                                View in Garbigo
                            </a>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td th:insert="~{email/fragments/layout :: footer}"></td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
