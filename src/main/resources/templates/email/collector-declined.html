<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Collector Declined</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef1f0;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);max-width:560px;width:100%;">

                <tr>
                    <td th:insert="~{email/fragments/layout :: header}"></td>
                </tr>

                <tr>
                    <td style="padding:28px 32px 0;text-align:center;">
                        <div style="display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;background-color:#fdeae9;">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 32px 32px;">
                        <h1 style="font-size:21px;color:#1b4332;margin:0 0 8px;text-align:center;letter-spacing:-0.2px;">Let's find you another collector</h1>
                        <p style="font-size:14px;color:#3c4a44;line-height:1.5;margin:0 0 24px;text-align:center;">
                            Hi <span th:text="${recipientName}">there</span>,
                            <span th:text="${collectorName}">your collector</span> wasn't able to take your
                            <span th:text="${serviceType}">Garbage pickup</span> request
                            (<span th:text="${requestId}">REQ-123</span>).
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="border:1px solid #e2e6e4;border-left:4px solid #b91c1c;border-radius:6px;overflow:hidden;">
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;white-space:nowrap;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7a75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;">
                                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                                    </svg>Reason given
                                </td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;font-weight:600;text-align:right;"
                                    th:text="${reason}">No reason given
                                </td>
                            </tr>
                        </table>

                        <p style="font-size:13px;color:#6b7a75;line-height:1.5;margin:20px 0 0;text-align:center;">
                            Your request is back to pending - no need to book again. Adjust the price if that's the
                            issue, then assign a collector (the same one or someone else).
                        </p>
                    </td>
                </tr>

                <tr>
                    <td th:insert="~{email/fragments/layout :: footer}"></td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
