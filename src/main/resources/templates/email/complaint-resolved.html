<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Garbigo Complaint Resolved</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef1f0;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);max-width:560px;width:100%;">

                <tr>
                    <td th:insert="~{email/fragments/layout :: header}"></td>
                </tr>

                <tr>
                    <td style="padding:28px 32px 0;text-align:center;">
                        <div style="display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;background-color:#e6f4ea;">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 32px 32px;">
                        <h1 style="font-size:21px;color:#1b4332;margin:0 0 8px;text-align:center;letter-spacing:-0.2px;">Complaint resolved</h1>
                        <p style="font-size:14px;color:#3c4a44;line-height:1.5;margin:0 0 24px;text-align:center;">
                            Hi <span th:text="${recipientName}">there</span>, the complaint you filed has been marked
                            resolved.
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="border:1px solid #e2e6e4;border-left:4px solid #15803d;border-radius:6px;overflow:hidden;">
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;white-space:nowrap;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7a75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;">
                                        <line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line>
                                        <line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line>
                                    </svg>Complaint ID
                                </td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${complaintId}">CMP-456
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;white-space:nowrap;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7a75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;">
                                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                                    </svg>What you reported
                                </td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;text-align:right;"
                                    th:text="${complaintDescription}">Missed pickup on scheduled date
                                </td>
                            </tr>
                        </table>

                        <p style="font-size:13px;color:#6b7a75;line-height:1.5;margin:20px 0 0;text-align:center;">
                            If this doesn't look resolved from where you're standing, just reply to this email or
                            reach support and we'll take another look.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td th:insert="~{email/fragments/layout :: footer}"></td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
