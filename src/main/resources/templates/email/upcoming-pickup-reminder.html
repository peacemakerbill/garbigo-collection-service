<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Garbigo Pickup Reminder</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef1f0;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);max-width:560px;width:100%;">

                <tr>
                    <td th:insert="~{email/fragments/layout :: header}"></td>
                </tr>

                <tr>
                    <td style="padding:28px 32px 0;text-align:center;">
                        <div style="display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;background-color:#fdf1e2;text-align:center;">
                            <span style="font-size:28px;font-weight:700;color:#d97706;">!</span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 32px 32px;">
                        <h1 style="font-size:21px;color:#1b4332;margin:0 0 8px;text-align:center;letter-spacing:-0.2px;">Your pickup is tomorrow</h1>
                        <p style="font-size:14px;color:#3c4a44;line-height:1.5;margin:0 0 24px;text-align:center;">
                            Hi <span th:text="${recipientName}">there</span>, just a heads up - this is auto-generated
                            from your recurring schedule.
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="border:1px solid #e2e6e4;border-left:4px solid #d97706;border-radius:6px;overflow:hidden;">
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;">Request ID</td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${requestId}">REQ-321
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;">Waste type</td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${wasteType}">GENERAL
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;border-bottom:1px solid #eef1f0;">Scheduled for</td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;font-weight:600;border-bottom:1px solid #eef1f0;text-align:right;"
                                    th:text="${scheduledAt}">Tomorrow, 09:00
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:13px 16px;font-size:13px;color:#6b7a75;">Pickup location</td>
                                <td style="padding:13px 16px;font-size:13px;color:#1b4332;font-weight:600;text-align:right;"
                                    th:text="${locationSummary}">Westlands, Nairobi
                                </td>
                            </tr>
                        </table>

                        <p style="text-align:center;font-size:13px;color:#9aa8a3;margin:24px 0 0;">
                            See you tomorrow
                        </p>
                    </td>
                </tr>

                <tr>
                    <td th:insert="~{email/fragments/layout :: footer}"></td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
