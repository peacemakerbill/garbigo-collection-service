server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: garbigo-collection-service

  # spring.mongodb.* (not spring.data.mongodb.*) as of Spring Boot 4.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/garbigo_collection}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # We only ever use StringRedisTemplate directly (rate limiting, JWT
      # revocation) - no actual Spring Data Redis repository interfaces.
      # Without this, having both Mongo and Redis on the classpath makes
      # every startup log "Could not safely identify store assignment" for
      # each of our 7 Mongo repositories, since Redis's own strict-mode
      # scan checks them too before correctly concluding none are its.
      repositories:
        enabled: false
    web:
      pageable:
        # Serialize Page<T> responses as Spring Data's stable PagedModel
        # shape ({content, page: {size, number, totalElements, totalPages}})
        # instead of the PageImpl internals, which Spring Data warns
        # aren't guaranteed stable across versions. Set via this property
        # rather than @EnableSpringDataWebSupport(pageSerializationMode =
        # VIA_DTO), which makes Boot ignore spring.data.web.pageable.*.
        serialization-mode: via-dto

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Only /actuator/health is exposed - not the full actuator surface.
management:
  endpoints:
    web:
      exposure:
        include: health

# Matches auth-service's own property paths (not a garbigo.* umbrella) - same env vars work on both services.
jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

rabbitmq:
  queue:
    user-created: ${RABBITMQ_QUEUE_USER_CREATED:user-created-queue}
  purge-queues-on-startup: ${PURGE_QUEUES_ON_STARTUP:false}

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8080}
  wallet:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8082}

# WalletServiceClient's contract is a guess - wallet-service isn't designed
# yet. This currency is just what CollectionRequestService/SewageRequestService
# pass along with a payment request.
payments:
  currency: ${PAYMENTS_CURRENCY:USD}

app:
  name: ${APP_NAME:Garbigo}
  url: ${APP_URL:http://localhost:3000}
  support-email: ${SUPPORT_EMAIL:support@garbigo.com}
  company:
    name: ${COMPANY_NAME:Garbigo Ltd}
    address: ${COMPANY_ADDRESS:Nairobi, Kenya}

collections:
  # How close to scheduledAt a client can still cancel without it being blocked.
  cancellation-cutoff-hours: ${CANCELLATION_CUTOFF_HOURS:2}

# Same style/name as auth-service's own rate-limit.requests-per-minute.
# Backed by Redis (RateLimitFilter) so it's correct across multiple instances.
rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

scheduling:
  # Job timing is plain numbers, not cron expressions. Times of day are UTC.
  recurring-requests:
    # A once-a-day job (generates today's requests, reminds for tomorrow), so
    # this is a time of day, not an interval - see RecurringScheduleRunner for
    # why it can't safely run every few minutes.
    run-at-hour-utc: ${RECURRING_REQUESTS_RUN_AT_HOUR_UTC:6}
    run-at-minute-utc: ${RECURRING_REQUESTS_RUN_AT_MINUTE_UTC:0}
    # Derived from the two numbers above - edit those, not this. Its own key so
    # the @Scheduled annotation reads one plain placeholder rather than two
    # embedded in a cron string (which IDE cron checkers can't resolve).
    schedule: "0 ${scheduling.recurring-requests.run-at-minute-utc} ${scheduling.recurring-requests.run-at-hour-utc} * * *"
  user-directory-sync:
    # Minutes between syncs, counted from the end of the previous one so a
    # slow run never overlaps the next. Minimum 1 (startup fails below that).
    interval-minutes: ${USER_DIRECTORY_SYNC_INTERVAL_MINUTES:10}
    # Also runs once immediately on startup by default - a pure upsert, so
    # there's no reason a fresh database should wait up to an hour before
    # any user's role is known.
    run-on-startup: ${USER_DIRECTORY_SYNC_ON_STARTUP:true}
    # How many times the startup attempt (only the startup one, not the
    # regular interval) retries if auth-service/RabbitMQ aren't quite up yet when this
    # service boots, and how long to wait between tries.
    startup-retry-attempts: ${USER_DIRECTORY_SYNC_STARTUP_RETRY_ATTEMPTS:3}
    startup-retry-delay-seconds: ${USER_DIRECTORY_SYNC_STARTUP_RETRY_DELAY_SECONDS:5}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# Just quiets SpringDoc's startup notice that /docs and /api-docs are
# reachable - doesn't touch springdoc.*.enabled, so the docs still work.
# Set those two properties to false instead if you actually want them off
# (e.g. in production).
logging:
  level:
    org.springdoc.core.events.SpringDocAppInitializer: ERROR