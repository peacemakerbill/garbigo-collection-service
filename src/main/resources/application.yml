server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: garbigo-collection-service

  # spring.mongodb.* (not spring.data.mongodb.*) as of Spring Boot 4.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/garbigo_collection}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Only /actuator/health is exposed - not the full actuator surface.
management:
  endpoints:
    web:
      exposure:
        include: health

# Matches auth-service's own property paths (not a garbigo.* umbrella) - same env vars work on both services.
jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

rabbitmq:
  queue:
    user-created: ${RABBITMQ_QUEUE_USER_CREATED:user-created-queue}
  purge-queues-on-startup: ${PURGE_QUEUES_ON_STARTUP:false}

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8080}
  wallet:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8082}

app:
  name: ${APP_NAME:Garbigo}
  url: ${APP_URL:http://localhost:3000}
  support-email: ${SUPPORT_EMAIL:support@garbigo.com}
  company:
    name: ${COMPANY_NAME:Garbigo Ltd}
    address: ${COMPANY_ADDRESS:Nairobi, Kenya}

collections:
  # How close to scheduledAt a client can still cancel without it being blocked.
  cancellation-cutoff-hours: ${CANCELLATION_CUTOFF_HOURS:2}

# Same style/name as auth-service's own rate-limit.requests-per-minute.
# Backed by Redis (RateLimitFilter) so it's correct across multiple instances.
rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

scheduling:
  # Standard Spring cron: second minute hour day-of-month month day-of-week.
  # Evaluated in UTC. Set a job's cron to "-" to disable it.
  recurring-requests:
    cron: "${RECURRING_REQUESTS_CRON:0 0 6 * * *}"
  user-directory-sync:
    cron: "${USER_DIRECTORY_SYNC_CRON:0 0 * * * *}"

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs